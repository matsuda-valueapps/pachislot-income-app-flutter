name: pachislot_income_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # 日本語ロケール対応
  flutter_localizations:
    sdk: flutter

  # iOSスタイルアイコン
  cupertino_icons: ^1.0.8

  # 状態管理
  provider: ^6.1.5

  # 日付・数値フォーマット
  intl: ^0.20.2

  # カレンダー
  table_calendar: ^3.2.0

  # グラフ
  fl_chart: ^1.0.0

  # ローカル保存
  shared_preferences: ^2.5.3

  # SQLite
  sqflite: ^2.4.2+1
  path: ^1.9.1

  # 外部リンク
  url_launcher: ^6.3.2

  holiday_jp: ^0.0.8

  flutter_multi_formatter: ^2.13.9

  # Google Fonts
  google_fonts: ^6.2.1
  file_picker: ^13.1.0
  google_mobile_ads: 5.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # アプリアイコン生成
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: 2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/koyaku/
    - assets/images/statistics/
    - assets/images/buttons/
    - assets/images/bottomnavigation/
    - assets/images/sections/
    - assets/images/servicez/
    - assets/images/drawer/
    - assets/icon/
    - assets/logo/